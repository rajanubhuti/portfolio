<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Under Construction</title>
<style>
  :root{
    --paper:#fdf6e3;
    --ink:#1a1a1a;
    --caution:#ffb400;
    --caution-dark:#1a1a1a;
    --cone:#ff5722;
    --cone-dark:#c73e0e;
    --steel:#3a4750;
    --muted:#7a7368;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0;
    padding:0;
    width:100%;
  }

  body{
    min-height:100vh;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--paper);
    display:flex;
    justify-content:center;
    align-items:center;
    color:var(--ink);
    overflow-x:hidden;
    position:relative;
  }

  .tape{
    position:fixed;
    left:0; right:0;
    height:34px;
    background:repeating-linear-gradient(
      -45deg,
      var(--caution),
      var(--caution) 22px,
      var(--caution-dark) 22px,
      var(--caution-dark) 44px
    );
    box-shadow:0 0 0 2px var(--caution-dark);
    z-index:5;
  }
  .tape.top{ top:0; }
  .tape.bottom{ bottom:0; }

  .card{
    max-width:640px;
    width:90%;
    text-align:center;
    padding:60px 40px;
    background:#fffdf8;
    border:3px solid var(--ink);
    border-radius:14px;
    box-shadow:8px 8px 0 var(--ink);
    position:relative;
    margin:50px 0;
  }

  .cone{
    width:60px;
    margin:0 auto 6px;
    display:block;
    animation:wobble 2.4s ease-in-out infinite;
    transform-origin:bottom center;
  }
  @keyframes wobble{
    0%,100%{ transform:rotate(-4deg); }
    50%{ transform:rotate(4deg); }
  }

  h1{
    font-size:2.6rem;
    margin:0 0 6px;
    letter-spacing:-0.5px;
  }

  .subtitle{
    font-family:'Courier New', monospace;
    font-size:0.85rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:26px;
  }

  p{
    font-size:1.08rem;
    line-height:1.65;
    margin:14px 0;
  }

  a.cta{
    display:inline-block;
    margin-top:22px;
    padding:14px 30px;
    background:var(--ink);
    color:var(--paper);
    text-decoration:none;
    border-radius:999px;
    font-weight:600;
    letter-spacing:0.3px;
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    box-shadow:4px 4px 0 var(--cone);
  }
  a.cta:hover{
    transform:translate(-2px,-2px);
    box-shadow:6px 6px 0 var(--cone);
    background:var(--cone-dark);
  }
  a.cta:active{
    transform:translate(0,0);
    box-shadow:2px 2px 0 var(--cone);
  }

  .progress-wrap{
    margin-top:44px;
    text-align:left;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-family:'Courier New', monospace;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .progress-track{
    height:16px;
    border-radius:999px;
    background:#eee6d6;
    border:2px solid var(--ink);
    overflow:hidden;
    position:relative;
  }
  .progress-fill{
    height:100%;
    width:73%;
    background:repeating-linear-gradient(
      45deg,
      var(--cone),
      var(--cone) 10px,
      var(--cone-dark) 10px,
      var(--cone-dark) 20px
    );
    background-size:200% 100%;
    animation:barber 1.4s linear infinite;
  }
  @keyframes barber{
    from{ background-position:0 0; }
    to{ background-position:40px 0; }
  }

  .fineprint{
    margin-top:16px;
    color:var(--muted);
    font-size:12px;
    font-style:italic;
  }

  @media (max-width:480px){
    h1{ font-size:2rem; }
    .card{ padding:44px 22px; }
  }
</style>
</head>
<body>

<div class="tape top"></div>
<div class="tape bottom"></div>

<div class="card">
  <svg class="cone" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="105" width="80" height="10" rx="2" fill="#c73e0e"/>
    <polygon points="50,10 75,100 25,100" fill="#ff5722"/>
    <rect x="30" y="55" width="40" height="12" fill="#fff"/>
    <rect x="20" y="80" width="60" height="14" fill="#fff"/>
  </svg>

  <h1>🚧 Oops.</h1>
  <div class="subtitle">Site currently staffed by one tired human</div>

  <p>You found my portfolio.</p>
  <p>Well technically you found the empty lot where my portfolio
    <b>will eventually stand.</b> </p>

  <a class="cta" href="https://www.linkedin.com/in/anubhutiraj-ux" target="_blank" rel="noopener">
    Find me on LinkedIn till then :) →
  </a>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>PORTFOLIO.EXE</span>
      <span>73%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
    <div class="fineprint">*73% has been holding steady since March lol I AM TRYING </div>
  </div>
</div>

</body>
</html>
